<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh}

.top-bar{background:rgba(0,0,0,0.95);border-bottom:1px solid rgba(24,210,110,0.15);padding:16px 24px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}

.search-wrap input{width:100%;padding:12px 16px 12px 42px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-size:15px;outline:none;transition:0.3s}

.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:rgba(255,255,255,0.3)}
.stats{font-size:13px;color:rgba(255,255,255,0.4);padding:4px 0}
.container{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.06)}
.cat-btn{padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.7);font-size:13px;cursor:pointer;transition:0.3s;font-family:'Inter',sans-serif}

.section-hdr .emoji{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:20px}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:20px;transition:all 0.3s;cursor:pointer;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#18d26e,#0ea5e9);opacity:0;transition:0.3s}
.card:hover{border-color:rgba(24,210,110,0.3);background:rgba(24,210,110,0.03);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.card:hover::before{opacity:1}
.card-num{font-size:11px;font-weight:700;color:#18d26e;background:rgba(24,210,110,0.1);padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:8px}
.card h3{font-size:15px;font-weight:600;color:#fff;margin-bottom:10px;line-height:1.4}
.card-prompt{font-size:13px;color:rgba(255,255,255,0.55);line-height:1.6;max-height:80px;overflow:hidden;transition:0.3s}
.card.expanded .card-prompt{max-height:2000px}
.card-tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.4);margin-top:10px}
.card-actions{display:flex;gap:8px;margin-top:12px;opacity:0;transition:0.3s}
.card:hover .card-actions{opacity:1}
.copy-btn{padding:6px 14px;border-radius:8px;border:1px solid rgba(24,210,110,0.3);background:rgba(24,210,110,0.08);color:#18d26e;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:0.2s}

mark{background:rgba(24,210,110,0.25);color:#fff;padding:1px 2px;border-radius:2px}

let activeCategory='All';
let searchTerm='';

function init(){
 const catsEl=document.getElementById('cats');
 const total=DATA.reduce((s,c)=>s+c.items.length,0);
 let html=`<button class="cat-btn active" onclick="filterCat('All',this)">All<span class="cat-count">${total}</span></button>`;
 DATA.forEach(c=>{html+=`<button class="cat-btn" onclick="filterCat('${c.cat}',this)">${c.icon} ${c.cat}<span class="cat-count">${c.items.length}</span></button>`;});
 catsEl.innerHTML=html;
 render();
}

function filterCat(cat,btn){
 activeCategory=cat;
 document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 render();
}

function hl(text,term){
 if(!term)return text;
 const re=new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');
 return text.replace(re,'<mark>$1</mark>');
}

function render(){
 const q=searchTerm.toLowerCase();
 let html='',count=0,gNum=0;
 DATA.forEach(cat=>{
  if(activeCategory!=='All'&&cat.cat!==activeCategory)return;
  const filtered=cat.items.filter(i=>!q||i.t.toLowerCase().includes(q)||i.p.toLowerCase().includes(q));
  if(!filtered.length)return;
  html+=`<div class="section-hdr"><span class="emoji">${cat.icon}</span>${cat.cat}</div><div class="grid">`;
  filtered.forEach((item,i)=>{
   count++;gNum++;
   html+=`<div class="card" onclick="toggleCard(this)" id="card-${gNum}">
    <span class="card-num">#${gNum}</span>
    <h3>${hl(item.t,searchTerm)}</h3>
    <div class="card-prompt">${hl(item.p,searchTerm)}</div>
    <span class="card-tag">${cat.cat}</span>
    <div class="card-actions"><button class="copy-btn" onclick="copyPrompt(event,'${gNum}')">📋 Copy Prompt</button></div>
   </div>`;
  });
  html+=`</div>`;
 });
 document.getElementById('content').innerHTML=html;
 document.getElementById('noResults').style.display=count?'none':'block';
 document.getElementById('stats').textContent=`Showing ${count} of ${DATA.reduce((s,c)=>s+c.items.length,0)} prompts`;
}

function toggleCard(el){if(!window.getSelection().toString())el.classList.toggle('expanded');}

function copyPrompt(e,id){
 e.stopPropagation();
 const card=document.getElementById('card-'+id);
 const text=card.querySelector('.card-prompt').textContent;
 navigator.clipboard.writeText(text).then(()=>{
  const btn=e.target;btn.textContent='✅ Copied!';btn.classList.add('copied');
  setTimeout(()=>{btn.textContent='📋 Copy Prompt';btn.classList.remove('copied');},1500);
 });
}

document.getElementById('searchInput').addEventListener('input',function(e){
 searchTerm=e.target.value;render();
});

window.addEventListener('scroll',()=>{
 document.getElementById('scrollTop').style.display=window.scrollY>300?'flex':'none';
});

init();
</script>
